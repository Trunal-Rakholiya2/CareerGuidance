<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Path Chat</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-main: #2d3748;
            --text-light: #718096;
            /* Premium Deep Aurora Gradient */
            --bg-animate: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #8E37D7, #4facfe);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-animate);
            background-size: 300% 300%;
            animation: gradientBG 25s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Back Button */
        .back-btn {
            /* Removed fixed position to integrate into header */
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a5568;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
            margin-right: 5px;
        }

        .back-btn:hover {
            transform: scale(1.1);
            background: white;
            color: #764ba2;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* Main Chat Container */
        .chat-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            /* Full viewport height */
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            overflow: hidden;
            /* Prevent body scroll */
        }

        /* Removed .chat-card wrapper to use full screen */
        /*
        .chat-card {
            ... removed ...
        }
        */

        /* Chat Header */
        .chat-header {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(118, 75, 162, 0.3);
        }

        .header-info h4 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            font-size: 1.2rem;
        }

        .header-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Custom Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Message Bubbles */
        .message {
            max-width: 85%;
            padding: 20px 25px;
            position: relative;
            font-size: 1rem;
            line-height: 1.6;
            animation: slideUp 0.4s ease-out;
            word-wrap: break-word;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-user {
            align-self: flex-end;
            background: var(--primary-gradient);
            color: white;
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.25);
        }

        .message-ai {
            align-self: flex-start;
            background: white;
            color: var(--text-main);
            border-radius: 20px 20px 20px 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .error-message {
            padding: 15px 20px;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%);
            border-left: 4px solid #e53e3e;
            border-radius: 10px;
            color: #742a2a;
            line-height: 1.6;
        }

        .error-message strong {
            color: #c53030;
            font-weight: 600;
        }

        .error-message small {
            display: block;
            margin-top: 8px;
            color: #9b2c2c;
            font-size: 0.9em;
        }

        /* Response Styling */
        .response-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #764ba2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header {
            font-weight: 700;
            color: #2d3748;
            margin-top: 15px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-content {
            color: #4a5568;
            padding-left: 2px;
            margin-bottom: 5px;
            white-space: pre-line;
            /* So multi-line backend text (with \n) shows nicely */
        }

        /* Buttons in Chat */
        .btn-option {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            color: #4a5568;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-top: 5px;
            cursor: pointer;
        }

        .btn-option:hover {
            background: #764ba2;
            color: white;
            border-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.2);
        }

        /* Input Area */
        .input-area {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        #chatInput {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        #chatInput:focus {
            border-color: #764ba2;
            background: white;
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.15);
        }

        .btn-send {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }

        .btn-send:hover {
            transform: scale(1.1) rotate(-10deg);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
        }

        /* Loader */
        .loader-container {
            display: none;
            /* Hidden by default */
            padding: 0 20px;
            margin-bottom: 20px;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 12px;
            height: 12px;
            background: #764ba2;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .spinner:nth-child(1) {
            animation-delay: -0.32s;
        }

        .spinner:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .loader-text {
            font-size: 0.9rem;
            color: #764ba2;
            font-weight: 600;
        }

        /* --- EXAM MODE STYLES --- */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #764ba2;
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        .toggle-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a5568;
            font-family: 'Outfit', sans-serif;
        }

        /* Exam Card Styling */
        .exam-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #764ba2;
        }

        .exam-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .exam-section {
            margin-bottom: 15px;
        }

        .exam-section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #553c9a;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .exam-text {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 8px;
            white-space: pre-line;
            /* Preserves line breaks */
        }

        /* Mode Indicator */
        .mode-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 8px;
            vertical-align: middle;
        }

        .mode-career {
            background: #ebf8ff;
            color: #3182ce;
        }

        .mode-exam {
            background: #faf5ff;
            color: #805ad5;
        }

        /* Staggered Animation for Data Items */
        .fade-in-item {
            opacity: 0;
            animation: fadeInItem 0.5s ease forwards;
        }

        @keyframes fadeInItem {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .chat-header {
                padding: 15px 20px;
            }

            .header-info h4 {
                font-size: 1.1rem;
            }

            .mode-badge {
                font-size: 0.7rem;
                padding: 3px 10px;
            }

            .chat-messages {
                padding: 20px;
            }

            .message {
                max-width: 92%;
                padding: 15px 20px;
            }

            .input-area {
                padding: 15px 20px;
                gap: 10px;
            }

            #chatInput {
                padding: 15px 20px;
            }

            .btn-send {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }

            .toggle-container {
                margin-right: 10px;
            }

            .toggle-label {
                display: none;
                /* Hide label on small screens to save space */
            }
        }
    </style>
</head>

<body>



    <!-- Main Layout -->
    <!-- Main Layout -->
    <div class="chat-layout">
        <!-- Chat Header -->

        <!-- Chat Header -->
        <div class="chat-header">
            <!-- Back Button Inside Header -->
            <a href="/home" class="back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>

            <div class="chat-avatar">
                <i class="bi bi-robot"></i>
            </div>
            <div class="header-info">
                <h4>AI Career Guide <span id="modeParams" class="mode-badge mode-career">Career Mode</span></h4>
                <p>Powered by Advanced Career DB</p>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <!-- Welcome Message -->
            <div class="message message-ai">
                <div class="response-title">👋 Hi there!</div>
                <p>I'm your AI Career Guide. Type a career name (like <b>Police</b>, <b>Doctor</b>, <b>Engineer</b>)
                    and I'll find the complete roadmap for you! 🚀</p>
            </div>
        </div>

        <!-- Loader -->
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <div class="spinner"></div>
            <div class="spinner"></div>
            <!-- <span class="loader-text">Analyzing career paths...</span> -->
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="examToggle">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label">Exams</span>
            </div>
            <div class="input-wrapper">
                <input type="text" id="chatInput" placeholder="Ask about a career..." autocomplete="off">
            </div>
            <button class="btn-send" id="sendBtn">
                <i class="bi bi-arrow-up-short"></i>
            </button>
        </div>

    </div>
    </div>

    <!-- JavaScript -->
    <script>
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const loader = document.getElementById('loader');
        const examToggle = document.getElementById('examToggle');
        const modeParams = document.getElementById('modeParams');

        let isExamMode = false;

        // Toggle Event Listener
        examToggle.addEventListener('change', function () {
            isExamMode = this.checked;
            if (isExamMode) {
                modeParams.textContent = "Exam Mode";
                modeParams.className = "mode-badge mode-exam";
                chatInput.placeholder = "Type an exam name (e.g., NEET, GPSC)...";
                createMessage("🔄 <b>Switched to Exam Mode</b>. Ask me details about any exam!", 'ai');
            } else {
                modeParams.textContent = "Career Mode";
                modeParams.className = "mode-badge mode-career";
                chatInput.placeholder = "Ask about a career...";
                createMessage("🔄 <b>Switched to Career Guidance Mode</b>. Ask me about career paths!", 'ai');
            }
        });

        // Function to create message element
        function createMessage(content, type, shouldScroll = true) {
            const div = document.createElement('div');
            div.className = `message message-${type}`;
            div.innerHTML = content;
            chatMessages.appendChild(div);
            // Auto scroll only if requested
            if (shouldScroll) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // Handle sending message
        async function sendMessage() {
            const query = chatInput.value.trim();
            if (!query) return;

            // User Message
            createMessage(query, 'user');
            chatInput.value = '';
            chatInput.focus();

            // Show loader
            loader.style.display = 'flex';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                let apiUrl = isExamMode
                    ? `/api/exam-info?exam=${encodeURIComponent(query)}`
                    : `/api/career-path?career=${encodeURIComponent(query)}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                loader.style.display = 'none';

                if (isExamMode) {
                    // --- EXAM MODE RESPONSE ---
                    if (data.status === 'success') {
                        let html = `<div class="response-title">📚 Exam Search Results</div>`;

                        data.data.forEach((exam, index) => {
                            html += `
                            <div class="exam-card fade-in-item" style="animation-delay: ${index * 0.15}s">
                                <div class="exam-title">${exam.exam_name || ''}</div>
                                
                                ${exam.conducting_authority ? `
                                <div class="exam-section-title">🏛️ Conducting Authority</div>
                                <div class="exam-text">${exam.conducting_authority}</div>
                                ` : ''}

                                ${exam.purpose ? `
                                <div class="exam-section-title">🎯 Purpose</div>
                                <div class="exam-text">${exam.purpose}</div>
                                ` : ''}

                                ${exam.number_of_papers ? `
                                <div class="exam-section-title">📄 Number of Papers</div>
                                <div class="exam-text">${exam.number_of_papers}</div>
                                ` : ''}

                                ${exam.total_marks ? `
                                <div class="exam-section-title">📊 Total Marks</div>
                                <div class="exam-text">${exam.total_marks}</div>
                                ` : ''}

                                ${exam.eligibility ? `
                                <div class="exam-section-title">✅ Eligibility Criteria</div>
                                <div class="exam-text">${exam.eligibility}</div>
                                ` : ''}

                                ${exam.importance ? `
                                <div class="exam-section-title">⭐ Why This Exam is Important</div>
                                <div class="exam-text">${exam.importance}</div>
                                ` : ''}

                                ${exam.colleges_and_degrees ? `
                                <div class="exam-section-title">🎓 Colleges & Degrees</div>
                                <div class="exam-text">${exam.colleges_and_degrees}</div>
                                ` : ''}

                                ${exam.subjects || exam.syllabus ? `
                                <div class="exam-section-title">📖 Subjects Included</div>
                                <div class="exam-text">${exam.subjects || exam.syllabus || ''}</div>
                                ` : ''}

                                ${exam.exam_level ? `
                                <div class="exam-section-title">🌐 Exam Level</div>
                                <div class="exam-text">${exam.exam_level}</div>
                                ` : ''}

                                ${exam.mode ? `
                                <div class="exam-section-title">💻 Mode of Exam</div>
                                <div class="exam-text">${exam.mode}</div>
                                ` : ''}

                                ${exam.pattern ? `
                                <div class="exam-section-title">📝 Exam Pattern</div>
                                <div class="exam-text">${exam.pattern}</div>
                                ` : ''}
                            </div>`;
                        });
                        createMessage(html, 'ai', false);
                    } else {
                        // Not found or error
                        let errorHtml = `<div class="error-message">`;
                        if (data.error_type === 'QUOTA_EXCEEDED') {
                            const retryAfter = data.retry_after || 60;
                            errorHtml += `⚠️ <strong>API Quota Exceeded</strong><br>`;
                            errorHtml += `${data.message}<br>`;
                            errorHtml += `<small>Please wait ${retryAfter} seconds before trying again, or upgrade your Gemini API plan.</small>`;
                        } else {
                            errorHtml += `😕 ${data.message}`;
                        }
                        errorHtml += `</div>`;
                        createMessage(errorHtml, 'ai');
                    }

                } else {
                    // --- CAREER MODE RESPONSE ---
                    if (data.status === 'success') {
                        const path = data.data;
                        
                        // Handle salary - can be string or object
                        let salaryDisplay = '';
                        if (path.salary) {
                            if (typeof path.salary === 'object' && path.salary !== null) {
                                salaryDisplay = `Starting: ${path.salary.starting || 'N/A'}\nAverage: ${path.salary.average || 'N/A'}\nHighest: ${path.salary.highest || 'N/A'}`;
                            } else {
                                salaryDisplay = path.salary;
                            }
                        }
                        
                        const html = `
                            <div class="response-title fade-in-item" style="animation-delay: 0.05s"><i class="bi bi-stars text-warning"></i> Career Path: ${path.career_name || path.stream_after_10th ? 'Career' : ''}</div>
                            
                            ${path.stream_after_10th || path.after_10th ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.1s">📘 Stream After 10th:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.15s">${path.stream_after_10th || path.after_10th || ''}</div>
                            ` : ''}

                            ${path.stream_after_12th || path.after_12th ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.2s">📗 Stream After 12th:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.25s">${path.stream_after_12th || path.after_12th || ''}</div>
                            ` : ''}

                            ${path.college_type ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.3s">🏫 College Type:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.35s">${path.college_type}</div>
                            ` : ''}

                            ${path.courses || path.course ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.4s">🎓 Available Courses:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.45s">${path.courses || path.course || ''}</div>
                            ` : ''}

                            ${path.entrance_exams || path.exams ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.5s">📝 Entrance Exams:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.55s">${path.entrance_exams || path.exams || ''}</div>
                            ` : ''}

                            ${path.future_scope || path.growth ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.6s">📈 Future Scope & Job Opportunities:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.65s">${path.future_scope || path.growth || ''}</div>
                            ` : ''}

                            ${salaryDisplay ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.7s">💰 Salary Details:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.75s">${salaryDisplay}</div>
                            ` : ''}

                            ${path.duration ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.8s">⏳ Course Duration:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.85s">${path.duration}</div>
                            ` : ''}

                            ${path.top_colleges ? `
                            <div class="section-header fade-in-item" style="animation-delay: 0.9s">🏛️ Top Colleges:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 0.95s">${path.top_colleges}</div>
                            ` : ''}

                            ${path.skills ? `
                            <div class="section-header fade-in-item" style="animation-delay: 1.0s">🛠️ Required Skills:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 1.05s">${path.skills}</div>
                            ` : ''}

                            ${path.reality_check || path.challenges ? `
                            <div class="section-header fade-in-item" style="animation-delay: 1.1s">⚠️ Reality Check:</div>
                            <div class="section-content fade-in-item" style="animation-delay: 1.15s">${path.reality_check || path.challenges || ''}</div>
                            ` : ''}
                        `;
                        createMessage(html, 'ai', false);

                    } else if (data.status === 'greeting') {
                        createMessage(data.message, 'ai');

                    } else if (data.status === 'follow_up') {
                        createMessage(data.message, 'ai');
                    } else {
                        // Error handling with specific messages
                        let errorHtml = `<div class="error-message">`;
                        if (data.error_type === 'QUOTA_EXCEEDED') {
                            const retryAfter = data.retry_after || 60;
                            errorHtml += `⚠️ <strong>API Quota Exceeded</strong><br>`;
                            errorHtml += `${data.message}<br>`;
                            errorHtml += `<small>Please wait ${retryAfter} seconds before trying again, or upgrade your Gemini API plan.</small>`;
                        } else if (data.error_type === 'AUTH_ERROR') {
                            errorHtml += `🔑 <strong>Authentication Error</strong><br>`;
                            errorHtml += `${data.message}`;
                        } else if (data.error_type === 'MODEL_NOT_FOUND') {
                            errorHtml += `❌ <strong>Model Not Found</strong><br>`;
                            errorHtml += `${data.message}`;
                        } else {
                            errorHtml += `😕 ${data.message}`;
                        }
                        errorHtml += `</div>`;
                        createMessage(errorHtml, 'ai');
                    }
                }

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                createMessage("⚠️ Oops! Something went wrong. Please try again.", 'ai');
            }
        }

        // Helper to format exam details (Basic heuristics)
        function formatExamDetail(text) {
            if (!text) return 'No details available.';

            // If text has "Header:" pattern, we can bold it
            // Replace newlines with <br> is handled by white-space: pre-line in CSS, 
            // but we might want to emphasize keywords.

            // Simple split by paragraphs
            let paragraphs = text.split('\n');
            let formatted = '';

            paragraphs.forEach(p => {
                if (p.trim().length > 0) {
                    // Check for "Title:" pattern
                    if (p.includes(':') && p.length < 100) {
                        let parts = p.split(':');
                        if (parts[0].length < 30) {
                            formatted += `<div class="exam-section-title">${parts[0]}:</div><div class="exam-text">${parts.slice(1).join(':')}</div>`;
                            return;
                        }
                    }
                    formatted += `<p>${p}</p>`;
                }
            });

            // Fallback if no specific formatting applied
            if (!formatted) return text;

            return formatted;
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

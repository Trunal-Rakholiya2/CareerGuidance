<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
            animation: slideIn 0.8s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.25rem rgba(118, 75, 162, 0.25);
        }
        .btn-primary {
            background: #764ba2;
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #5a3780;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
         .navbar-nav .nav-link:hover {
      color: #0d6efd; /* Hover color */
      text-decoration: underline; /* Add underline on hover */
      text-underline-offset: 5px; /* visually appealing */
    }

    </style>
</head>

<body>

<div class="container-fluid d-flex justify-content-center align-items-center px-4 py-5">
<div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

<div class="card p-2">
<div class="card-body p-4">

<h3 class="text-center mb-2 fw-bold" style="color: #764ba2;">Login</h3>
<p class="text-center mb-4">Welcome back</p>

<!-- Flash Messages (Server-side) -->
{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert alert-danger p-2 text-center">
    {{ messages[0] }}
</div>
{% endif %}
{% endwith %}
<form method="POST" action="/login" class="needs-validation" novalidate>
            <!-- Email -->
            <div class="form-floating mb-3">
                <input type="email"
                       class="form-control" id="floatingEmail" placeholder="name@example.com"
                       name="user_email"
                       required>
                <label for="floatingEmail"><i class="bi bi-envelope me-2"></i>Email Address</label>
                <div class="invalid-feedback">
                    Please enter a valid email.
                </div>
            </div>

            <!-- Password -->
            <div class="form-floating mb-3">
                <input type="password"
                       class="form-control" id="floatingPassword" placeholder="Password"
                       name="user_password"
                       required
                       minlength="6">
                <label for="floatingPassword"><i class="bi bi-lock me-2"></i>Password</label>
                <div class="invalid-feedback">
                    Please enter your password.
                </div>
    </div>
             <!-- Login Button -->
<div class="d-grid mb-3">
    <button class="btn btn-primary rounded-pill shadow-sm" type="submit">
        Login
    </button>
</div>

<!-- Signup link -->
<p class="text-center mt-4 mb-0 text-muted">
    Don’t have an account?
    <a href="/signup" class="fw-bold text-decoration-none" style="color: #764ba2;">
        Sign Up
    </a>
</p>

</form>


</div>
</div>
</div>
</div>


<!-- Bootstrap Validation Script -->
<script>
(() => {
  'use strict'
  const form = document.querySelector('.needs-validation')
  form.addEventListener('submit', event => {
    if (!form.checkValidity()) {
      event.preventDefault()
      event.stopPropagation()
    }
    form.classList.add('was-validated')
  })
})()
</script>

</body>
</html>
